<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LM Sabor Caseiro — Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cardapio.css">
</head>
<body>

<!-- LOADER -->
<div id="loader-overlay">
  <div class="loader-spinner"></div>
  <div class="loader-texto">Carregando cardápio...</div>
</div>

<!-- FUNDO -->
<div id="bg-fallback"></div>
<img id="background" src="assets/fundo.webp" onerror="this.style.display='none'">
<div id="overlay-left"></div>
<div id="overlay-right"></div>
<div id="overlay-bottom"></div>
<div id="grain"></div>

<!-- PAINEL CENTRAL -->
<div id="slide-container">
  <div id="slide-num">01 / --</div>
</div>

<!-- UI PRINCIPAL -->
<div id="ui">

  <!-- ESQUERDA -->
  <div id="left">
    <div id="logo-area">
      <img id="logo-img" src="assets/logomarca.webp" onerror="this.style.display='none'">
      <div id="logo-texto">
        <div id="brand-nome">LM Sabor Caseiro</div>
        <div id="brand-slogan">Comida feita com amor</div>
      </div>
    </div>

    <div id="dish-area">
      <div id="dish-categoria">
        <div id="cat-linha"></div>
        <div id="cat-texto">...</div>
      </div>
      <div id="nome">—</div>
      <div id="separador">
        <div id="sep-bolinha"></div>
        <div id="sep-linha"></div>
      </div>
      <div id="dish-desc"></div>
      <div id="dish-tags"></div>
    </div>

    <div id="bottom-left">
      <div id="progress-wrap">
        <div id="prox-info">
          <span id="prox-label">A seguir</span>
          <span id="prox-seta">→</span>
          <span id="prox-nome">...</span>
        </div>
        <div id="progress-dots"></div>
      </div>
    </div>
  </div>

  <!-- DIREITA -->
  <div id="right">

    <div id="datetime-box">
      <div id="date"></div>
      <div id="clock">--:--</div>
    </div>

    <!-- DESTAQUES DO DIA -->
    <div id="destaques-box">
      <div id="dest-titulo">✦ No cardápio hoje</div>
      <div id="dest-lista"></div>
    </div>

    <!-- COPA DO MUNDO 2026 -->
    <div id="copa-box">

      <div id="copa-header">
        <span id="copa-flag">🇧🇷</span>
        <div id="copa-titulo-wrap">
          <div id="copa-titulo">COPA DO MUNDO 2026</div>
          <div id="copa-subtitulo">Grupo C · Brasil</div>
        </div>
        <div id="copa-trofeu">🏆</div>
      </div>

      <div id="copa-tabs">
        <button class="copa-tab ativo" data-tab="jogo">📅 Próximo Jogo</button>
        <button class="copa-tab" data-tab="grupo">📊 Grupo</button>
        <button class="copa-tab" data-tab="jogos">⚽ Jogos</button>
        <button class="copa-tab" data-tab="fotos">🇧🇷 Seleção</button>
      </div>

      <div id="copa-content">

        <!-- ABA: PRÓXIMO JOGO (sem escalação) -->
        <div class="copa-panel ativo" id="tab-jogo">
          <div id="placar-wrap">
            <div class="placar-time">
              <div class="placar-bandeira">🇧🇷</div>
              <div class="placar-nome">Brasil</div>
              <div class="placar-gol" id="gol-bra">–</div>
            </div>
            <div id="placar-meio">
              <div id="placar-status">Próximo Jogo</div>
              <div id="placar-local">A definir</div>
              <div id="placar-data" style="font-size: 0.45rem; color: rgba(255,255,255,0.4); margin-top: 4px;"></div>
            </div>
            <div class="placar-time">
              <div class="placar-bandeira">🏳️</div>
              <div class="placar-nome">A definir</div>
              <div class="placar-gol" id="gol-mar">–</div>
            </div>
          </div>
          <div id="jogo-info">
            <span class="jogo-tag">Grupo C</span>
            <span class="jogo-tag jogo-tag-ao-vivo" id="jogo-live-badge" style="display:none">🔴 AO VIVO</span>
          </div>
          <!-- ESCALAÇÃO REMOVIDA DA PRIMEIRA ABA -->
        </div>

        <!-- ABA: GRUPO C -->
        <div class="copa-panel" id="tab-grupo">
          <table id="grupo-tabela">
            <thead>
              <tr><th>Seleção</th><th>J</th><th>P</th><th>SG</th></tr>
            </thead>
            <tbody id="grupo-tbody"></tbody>
          </table>
          <div id="grupo-nota">Os 2 primeiros + melhores 3ºs avançam</div>
        </div>

        <!-- ABA: PRÓXIMOS JOGOS -->
        <div class="copa-panel" id="tab-jogos">
          <div id="jogos-lista"></div>
        </div>

        <!-- ABA: SELEÇÃO (escalação completa) -->
        <div class="copa-panel" id="tab-fotos">
          <div id="fotos-grid"></div>
          <div id="fotos-caption"></div>
        </div>

      </div><!-- /copa-content -->
    </div><!-- /copa-box -->
  </div><!-- /right -->
</div><!-- /ui -->

<!-- TIMER BAR -->
<div id="timer-bar"><div id="timer-fill"></div></div>

<script src="ofertas.js"></script>
</body>
</html>
